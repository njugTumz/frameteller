name: Deploy marketing page

on:
  push:
    branches: [main]
    paths:
      - "marketing/**"
      - "frontend/e2e-marketing/**"
      - ".github/workflows/deploy-marketing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-marketing
  cancel-in-progress: false

jobs:
  test:
    name: Test the page in Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright (marketing page, gallery API faked)
        run: npm run e2e:marketing

  deploy:
    name: Deploy to Azure Static Web Apps
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate JSON files
        run: |
          for f in marketing/updates.json marketing/staticwebapp.config.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::Invalid JSON"; exit 1; }
          done

      - name: Deploy marketing/
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MARKETING }}
          action: upload
          app_location: marketing
          output_location: ""
          skip_app_build: true
