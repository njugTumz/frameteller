name: CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, imports, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      azurite:  # Blob Storage emulator for the blob adapter contract tests
        image: mcr.microsoft.com/azure-storage/azurite:3.37.0
        ports:
          - 10000:10000
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install -e . --group dev

      - name: Ruff lint
        run: ruff check src tests scripts

      - name: Ruff format
        run: ruff format --check src tests scripts

      - name: Mypy (strict)
        run: mypy

      - name: Import contracts
        run: lint-imports
        env:
          PYTHONPATH: src

      - name: OpenAPI schema is current
        run: python scripts/export_openapi.py --check

      - name: Tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90

  backend-image:
    name: Backend image (build only, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build --tag frameteller-backend:ci backend --build-context agents=agents

      - name: Container starts and passes its health check
        run: |
          docker run -d --name backend -p 8000:8000 -e MODEL_API_KEY=LLM_ci_placeholder_not_a_key frameteller-backend:ci
          for i in $(seq 30); do curl -sf http://127.0.0.1:8000/healthz && exit 0; sleep 1; done
          docker logs backend
          exit 1

  frontend:
    name: Frontend (lint, types, API types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: API types match backend/openapi.json
        run: npm run api:check

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

  frontend-e2e:
    name: Frontend end-to-end (mocked backend, headless Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Chromium for the desktop and Pixel 7 projects, WebKit (iOS Safari's engine) for the iPhone 14 ones.
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      # Without a sound server, Chromium's fake microphone runs many times faster than real time.
      - name: Start a PulseAudio server
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1

      # The live suite (E2E_LIVE=1) spends Meta credits and needs the narration recording: never in CI.
      # Projects: desktop, and phones (iPhone 14 in WebKit, Pixel 7 in Chromium, portrait and landscape).
      - name: Playwright (mocked, desktop and phones)
        run: npx playwright test

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7
