name: Deploy staging

# Builds the backend image, deploys infra/main.bicep to rg-frameteller-staging and checks the app answers.
# Azure auth is OIDC (no stored passwords); AZURE_* are environment variables, MODEL_API_KEY an environment secret.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false # never cut a deployment off half-way

env:
  RESOURCE_GROUP: rg-frameteller-staging

jobs:
  image:
    name: Build and push the backend image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/frameteller-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build
        run: >
          docker build backend --build-context agents=agents
          --tag "${{ steps.name.outputs.image }}"
          --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"
          --label "org.opencontainers.image.revision=${GITHUB_SHA}"

      - name: Push
        run: docker push "${{ steps.name.outputs.image }}"

  deploy:
    name: Deploy to staging
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write # OIDC token for azure/login
    env:
      CONTAINER_IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Meta key is set
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          GLIMMER_API_KEY: ${{ secrets.GLIMMER_API_KEY }}
          GLIMMER_BASE_URL: ${{ vars.GLIMMER_BASE_URL }}
          REVIEWER: ${{ vars.REVIEWER || 'spark' }}
        run: |
          if [ -z "$MODEL_API_KEY" ]; then
            echo "::error::The staging environment has no MODEL_API_KEY secret. Set it with: gh secret set MODEL_API_KEY --env staging"
            exit 1
          fi

      - name: Image is publicly pullable
        # Container Apps pulls without registry credentials, so the GHCR package must be public.
        run: |
          if ! docker manifest inspect "$CONTAINER_IMAGE" > /dev/null; then
            echo "::error::$CONTAINER_IMAGE cannot be pulled anonymously. Make the package public once: https://github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/frameteller-backend/settings (Danger Zone, Change visibility), then re-run this job."
            exit 1
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          GLIMMER_API_KEY: ${{ secrets.GLIMMER_API_KEY }}
          GLIMMER_BASE_URL: ${{ vars.GLIMMER_BASE_URL }}
          REVIEWER: ${{ vars.REVIEWER || 'spark' }}
        run: >
          az deployment group what-if
          --resource-group "$RESOURCE_GROUP"
          --template-file infra/main.bicep
          --parameters infra/parameters/staging.bicepparam

      - name: Deploy infrastructure and image
        id: deploy
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          GLIMMER_API_KEY: ${{ secrets.GLIMMER_API_KEY }}
          GLIMMER_BASE_URL: ${{ vars.GLIMMER_BASE_URL }}
          REVIEWER: ${{ vars.REVIEWER || 'spark' }}
        run: |
          url=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "staging-${GITHUB_SHA::7}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infra/main.bicep \
            --parameters infra/parameters/staging.bicepparam \
            --query properties.outputs.appUrl.value --output tsv)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $CONTAINER_IMAGE to $url"

      - name: Health and readiness
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          # Scale to zero: the first request may wait for a cold start, and a new identity's storage role
          # can take a few minutes to apply, so retry for up to 5 minutes before failing.
          for path in /healthz /readyz; do
            for attempt in $(seq 30); do
              code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 30 "$URL$path" || true)
              [ "$code" = "200" ] && break
              echo "$path: HTTP $code (attempt $attempt), retrying"
              sleep 10
            done
            echo "$path: HTTP $code $(cat /tmp/body)"
            [ "$code" = "200" ] || exit 1
          done
